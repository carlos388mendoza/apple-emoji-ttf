name: Build web font (from released Linux TTF)

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/build-web-ubuntu.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools + brotli
        run: pip install "fonttools[woff]" brotli

      - name: Download released Apple Color Emoji (Linux) TTF
        run: |
          mkdir -p input output
          curl -fL -o input/AppleColorEmoji.ttf \
            "https://github.com/samuelngs/apple-emoji-ttf/releases/download/macos-26-20260218-d5729b24/AppleColorEmoji-Linux.ttf"
          ls -la input

      - name: Split into unicode-range chunks + CSS
        run: python tools/build_web_chunks.py input/AppleColorEmoji.ttf output 480

      - name: List output
        run: ls -la output | head -40

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-emoji-web
          path: output/
          retention-days: 5
