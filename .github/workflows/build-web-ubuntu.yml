name: Build web font (from released Linux TTF)

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/build-web-ubuntu.yml"
      - "tools/build_web_chunks.py"
      - "tools/inspect_web_font.py"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools + brotli
        run: pip install "fonttools[woff]" brotli

      - name: Download released Apple Color Emoji TTF (Linux and Windows)
        run: |
          mkdir -p input output
          curl -fL -o input/AppleColorEmoji-Linux.ttf \
            "https://github.com/samuelngs/apple-emoji-ttf/releases/download/macos-26-20260722-484daf4e/AppleColorEmoji-Linux.ttf"
          curl -fL -o input/AppleColorEmoji-Windows.ttf \
            "https://github.com/samuelngs/apple-emoji-ttf/releases/download/macos-26-20260722-484daf4e/AppleColorEmoji-Windows.ttf"
          ls -la input

      - name: Inspect both fonts
        run: python tools/inspect_web_font.py input/AppleColorEmoji-Linux.ttf input/AppleColorEmoji-Windows.ttf

      - name: Split into unicode-range chunks + CSS
        run: python tools/build_web_chunks.py input/AppleColorEmoji-Windows.ttf output 1500

      - name: List output
        run: ls -la output | head -40

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-emoji-web
          path: output/
          retention-days: 5
