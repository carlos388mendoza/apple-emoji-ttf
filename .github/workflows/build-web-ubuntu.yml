name: Build web font (from released Windows TTF)

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/build-web-ubuntu.yml"
      - "tools/build_web_chunks.py"
      - "tools/inspect_web_font.py"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools + brotli
        run: pip install "fonttools[woff]" brotli

      - name: Download released Apple Color Emoji (Windows build, trae GSUB)
        run: |
          mkdir -p input output
          curl -fL -o input/AppleColorEmoji-Windows.ttf \
            "https://github.com/samuelngs/apple-emoji-ttf/releases/download/macos-26-20260722-484daf4e/AppleColorEmoji-Windows.ttf"
          ls -la input

      - name: Download the emoji catalog of the app
        run: |
          curl -fL -o input/emojis-es.json \
            "https://wiki-grupo-comidas.vercel.app/iconos/emojis-es.json"
          ls -la input/emojis-es.json

      - name: Inspect the font
        run: python tools/inspect_web_font.py input/AppleColorEmoji-Windows.ttf

      - name: Split into unicode-range chunks + CSS
        run: |
          python tools/build_web_chunks.py input/AppleColorEmoji-Windows.ttf output \
            --catalog input/emojis-es.json --ppem 96 --budget-kb 700

      - name: Verify the chunks
        run: python tools/verify_web_chunks.py output --catalog input/emojis-es.json

      - name: List output
        run: ls -la output | head -60

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-emoji-web
          path: output/
          retention-days: 5
